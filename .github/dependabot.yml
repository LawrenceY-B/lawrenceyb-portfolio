version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      # These must move in step; separate PRs fail CI on peer-version mismatches.
      next-react:
        patterns:
          - next
          - eslint-config-next
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
      # Majors stay out of the group so one breaking release can't sink the whole batch.
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # three is pinned to r128 on purpose; upgrading changes shader and geometry APIs.
      - dependency-name: three
      - dependency-name: "@types/three"
      # Toolchain majors are done by hand. @types/node tracks the Node we run (22, see .nvmrc).
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
