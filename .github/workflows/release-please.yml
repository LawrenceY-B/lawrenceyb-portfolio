name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Keeps a "chore(main): release x.y.z" PR up to date with the next version and changelog.
      # Merging it bumps package.json, tags vX.Y.Z and publishes a GitHub Release.
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
